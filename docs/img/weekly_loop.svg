<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="330" fill="#fcfcfb"/>
  <text x="20" y="30" font-size="16" fill="#0b0b0b">One week of mpc_pulse_rec_v13</text>
  <text x="20" y="50" font-size="11" fill="#52514e">grey: the benchmark's own planner (vendored in sbflow/) · blue: our additions · repeated 52 times on Small, 104 on Full</text>

  <!-- 1 observation -->
  <rect x="20" y="80" width="170" height="150" rx="8" fill="#f2f1ee" stroke="#a9a8a2"/>
  <text x="105" y="104" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="bold">1. Observe</text>
  <text x="32" y="128" font-size="11" fill="#52514e">stock at every node</text>
  <text x="32" y="146" font-size="11" fill="#52514e">cargo on its way</text>
  <text x="32" y="164" font-size="11" fill="#52514e">the network this week:</text>
  <text x="32" y="182" font-size="11" fill="#52514e">capacities, closures,</text>
  <text x="32" y="200" font-size="11" fill="#52514e">bans, tariffs, demand</text>
  <text x="32" y="218" font-size="10" fill="#8a8984">(warnings are ignored)</text>

  <!-- 2 forecast -->
  <rect x="220" y="80" width="170" height="150" rx="8" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="305" y="104" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="bold">2. Forecast</text>
  <text x="232" y="122" font-size="10" fill="#2a78d6">recovery.py</text>
  <text x="232" y="142" font-size="11" fill="#52514e">a closed strait, a port</text>
  <text x="232" y="160" font-size="11" fill="#52514e">strike or an energy</text>
  <text x="232" y="178" font-size="11" fill="#52514e">shock ends when its</text>
  <text x="232" y="196" font-size="11" fill="#52514e">event type usually</text>
  <text x="232" y="214" font-size="11" fill="#52514e">ends, not never</text>

  <!-- 3 LP -->
  <rect x="420" y="80" width="230" height="150" rx="8" fill="#f2f1ee" stroke="#a9a8a2"/>
  <text x="535" y="104" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="bold">3. Plan 20 weeks (LP)</text>
  <text x="432" y="124" font-size="11" fill="#52514e">cheapest flows that respect</text>
  <text x="432" y="142" font-size="11" fill="#52514e">stock, capacity, lead times</text>
  <rect x="430" y="152" width="210" height="70" rx="6" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="440" y="168" font-size="10" fill="#2a78d6">reserve.py adds to the LP:</text>
  <text x="440" y="184" font-size="10" fill="#52514e">· value of goods at window end</text>
  <text x="440" y="198" font-size="10" fill="#52514e">· fuel reserve at grids and straits</text>
  <text x="440" y="212" font-size="10" fill="#52514e">· price of a scarce fuel in chips</text>

  <!-- 4 pulse -->
  <rect x="680" y="80" width="200" height="150" rx="8" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="780" y="104" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="bold">4. Adjust week 1</text>
  <text x="692" y="122" font-size="10" fill="#2a78d6">pulse.py</text>
  <text x="692" y="142" font-size="11" fill="#52514e">short fuel held, then</text>
  <text x="692" y="160" font-size="11" fill="#52514e">sent in whole weeks</text>
  <text x="692" y="178" font-size="11" fill="#52514e">wafers topped up</text>
  <text x="692" y="196" font-size="11" fill="#52514e">fuel trimmed in slack</text>
  <text x="692" y="214" font-size="11" fill="#52514e">unburnable fuel cancelled</text>

  <!-- 5 act -->
  <rect x="910" y="80" width="170" height="150" rx="8" fill="#f2f1ee" stroke="#a9a8a2"/>
  <text x="995" y="104" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="bold">5. Act</text>
  <text x="922" y="128" font-size="11" fill="#52514e">send the week's flows</text>
  <text x="922" y="146" font-size="11" fill="#52514e">and strait releases;</text>
  <text x="922" y="164" font-size="11" fill="#52514e">the simulator plays the</text>
  <text x="922" y="182" font-size="11" fill="#52514e">week, disruptions hit,</text>
  <text x="922" y="200" font-size="11" fill="#52514e">costs are counted</text>

  <line x1="190" y1="155" x2="218" y2="155" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="155" x2="418" y2="155" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="155" x2="678" y2="155" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="155" x2="908" y2="155" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="664" y="146" font-size="9" fill="#52514e" text-anchor="middle">week 1</text>

  <!-- loop back -->
  <path d="M995,230 L995,300 L105,300 L105,232" fill="none" stroke="#52514e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="550" y="292" font-size="11" fill="#52514e" text-anchor="middle">next week: observe again and re-plan from scratch (receding horizon); weeks 2 to 20 of the plan are thrown away</text>

  <!-- guard -->
  <rect x="410" y="245" width="250" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-dasharray="4 3"/>
  <text x="535" y="266" font-size="10" fill="#0b0b0b" text-anchor="middle">CPU guard (agent.py): stop at 0.8 × budget</text>
</svg>
